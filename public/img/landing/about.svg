<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="ap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="aa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <circle cx="345" cy="40" r="70" fill="url(#ap)" opacity="0.10"/>
  <circle cx="45" cy="255" r="85" fill="url(#aa)" opacity="0.08"/>

  <!-- Table / bureau -->
  <rect x="60" y="230" width="280" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="80" y="244" width="16" height="30" rx="4" fill="#94a3b8"/>
  <rect x="300" y="244" width="16" height="30" rx="4" fill="#94a3b8"/>

  <!-- Corps du personnage -->
  <circle cx="200" cy="95" r="40" fill="#f1f5f9"/>
  <circle cx="200" cy="92" r="34" fill="#fbbf24"/>
  <!-- Visage -->
  <circle cx="200" cy="88" r="27" fill="#fcd9b8"/>
  <!-- Cheveux -->
  <path d="M173 84 a27 27 0 0 1 54 0 l-6 0 a21 21 0 0 0 -42 0 z" fill="#334155"/>
  <!-- Yeux et sourire -->
  <circle cx="191" cy="88" r="3" fill="#334155"/>
  <circle cx="209" cy="88" r="3" fill="#334155"/>
  <path d="M191 99 q9 5 18 0" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Corps / chemise -->
  <path d="M170 128 q30 -12 60 0 l10 40 q-40 30 -80 0 z" fill="url(#ap)"/>
  <rect x="182" y="130" width="36" height="6" rx="3" fill="#ffffff" opacity="0.5"/>

  <!-- Document tenu à la main -->
  <g transform="translate(225,150) rotate(10)">
    <rect x="0" y="0" width="95" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="10" y="10" width="20" height="20" rx="6" fill="url(#aa)"/>
    <rect x="36" y="12" width="50" height="8" rx="4" fill="#94a3b8"/>
    <rect x="36" y="24" width="40" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="10" y="38" width="75" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="10" y="50" width="60" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="10" y="58" width="34" height="10" rx="5" fill="#7dd3fc"/>
    <text x="27" y="66" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="7" font-weight="700" fill="#0369a1">DEVIS</text>
  </g>

  <!-- Phone à côté -->
  <g transform="translate(90,180) rotate(-10)">
    <rect x="0" y="0" width="60" height="96" rx="12" fill="#0f172a"/>
    <rect x="20" y="10" width="20" height="4" rx="2" fill="#475569"/>
    <rect x="8" y="24" width="44" height="18" rx="5" fill="url(#ap)"/>
    <rect x="8" y="48" width="44" height="6" rx="3" fill="#334155"/>
    <rect x="8" y="58" width="30" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- Pièces -->
  <circle cx="310" cy="220" r="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="310" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" fill="#b45309">CFA</text>
</svg>
